openapi: 3.1.0
info:
  title: ShortSB API
  description: |
    ## 로컬 인증 테스트 순서

    1. [구글 로그인 시작](/oauth2/authorization/google)을 **새 탭에서 열어** 로그인하세요.
       완료 후 이 Swagger 탭으로 돌아옵니다. 세션 쿠키는 같은 브라우저에서 자동 전달됩니다.
       성공 URL의 프런트가 실행 중이 아니어도 아래 내 정보 조회로 로그인 결과를 확인할 수 있습니다.
    2. **회원 → 로그인한 내 정보 조회 → Try it out → Execute**로 200과 회원 정보를 확인합니다.
    3. **인증 → CSRF 토큰 조회 → Try it out → Execute** 후 실제 응답의 `token`을 복사합니다.
    4. **인증 → 로그아웃 → Try it out**에서 `X-CSRF-TOKEN`에 복사한 토큰을 넣고 Execute합니다.
       정상 결과는 **204(응답 본문 없음)** 입니다.
    5. 내 정보 조회를 다시 Execute하면 **401 / AUTHENTICATION_REQUIRED**가 반환돼야 합니다.

    로그인·로그아웃 후에는 CSRF 토큰을 다시 조회하세요. Example Value의 값이 아닌 실제 응답 토큰을 사용합니다.
    비로그인 상태의 내 정보 조회 401, 로그인 상태에서 잘못된 CSRF 토큰으로 로그아웃할 때 403도 확인할 수 있습니다.
    구글 로그인은 위 링크로 페이지를 이동해 진행합니다. 클라이언트 비밀값이나 세션 쿠키를 문서에 입력하지 않습니다.

    ## 첫 추천·발췌 사용 순서

    로그인·CSRF 토큰 조회 후 **추천 발췌 → 첫 추천 발췌 생성**에서 X-CSRF-TOKEN과 요청 본문을 입력하세요.
    요청 예시 네 가지로 카드만·프롬프트만·둘 다·ANY 단독 경로를 확인할 수 있습니다.
    생성 응답의 previewId는 발췌 재조회에, book.bookId는 도서 정보 조회에 사용합니다.
    실제 데이터 등록과 작품 권한 승인이 먼저 필요합니다. 벡터 검색은 본문/카드 벡터 등록이 필요하고,
    프롬프트 입력은 FastAPI GPU 연결도 필요합니다.

    ## 대비 발췌 사용 순서

    첫 추천의 previewId와 현재 CSRF 토큰을 **대비 발췌 → 대비 작품 발췌 추천**에 입력하세요.
    CSV 후보뿐 아니라 양쪽 작품 승인과 실제 근거 검수가 필요합니다.
    200·available=false는 적합한 승인 관계가 없는 정상 결과입니다. 모델/본문 준비 오류 503과 구분합니다.
    성공하면 contrast.book.bookId, 첫 작품이면 기존 book.bookId를 전체 독서 시작에 사용하세요.

    ## 전체 독서 사용 순서

    **전체 독서 → 시작**에서 bookId를 문자열로 입력하고 sessionId·version을 확인하세요.
    페이지 조회 후 위치 저장에 pageNo·position·version·status를 전달합니다. position은 UTF-16 기준입니다.
    중단 시 status를 paused로 저장하고, 최근 미완료 조회에서 이어 읽을 현재 위치를 확인합니다.
    마지막 페이지 끝을 저장한 뒤 완료 요청에 최신 version을 전달하세요.
    409 응답의 current를 반영하며 과거 요청의 version만 바꿔 자동 재전송하지 않습니다.
    전체 독서 SQL 적용과 승인 도서 등록이 먼저 필요합니다. GPU 연결은 독서 API에 필요하지 않습니다.
  version: R4
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: 추천 발췌
  description: 쪽수·카드·선택 프롬프트 기반 첫 추천과 세션 발췌 재조회
- name: 대비 발췌
  description: 첫 발췌 안의 검수 근거와 연결되는 다른 작품 추천
- name: 도서
  description: 제공 승인된 작품의 정보·출처·번역 안내 조회
- name: 인증
  description: 구글 로그인 후 같은 브라우저의 세션 쿠키로 테스트한다. CSRF 조회 후 로그아웃을 실행한다.
- name: 회원
  description: 현재 로그인한 회원의 정보를 조회한다.
- name: 전체 독서
  description: 승인 도서 전체 읽기·현재/최대 위치 저장·재개·완료
paths:
  /api/logout:
    post:
      tags:
      - 인증
      summary: 로그아웃
      description: |
        구글 로그인과 CSRF 토큰 조회를 먼저 수행하세요.
        X-CSRF-TOKEN에 현재 응답의 token을 입력하면 세션을 무효화하고 JSESSIONID 쿠키를 제거합니다.
        요청 본문은 없습니다. 성공 후 내 정보 조회는 401이어야 하며,
        재로그인 후에는 새 CSRF 토큰이 필요합니다.
        비로그인 요청은 유효한 CSRF 토큰이 있어도 401입니다. CSRF 검증이 먼저 실패하면 403입니다.
      operationId: logout
      parameters:
      - name: X-CSRF-TOKEN
        in: header
        description: GET /api/csrf의 실제 응답에서 복사한 token 값
        required: true
        schema:
          type: string
      responses:
        "204":
          description: 로그아웃 성공. 응답 본문 없음
        "401":
          description: 로그인 필요 또는 세션 만료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                message: 로그인이 필요합니다.
                code: AUTHENTICATION_REQUIRED
        "403":
          description: CSRF 토큰 누락·위조·이전 세션의 토큰
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                message: CSRF 토큰을 다시 확인해주세요.
                code: CSRF_INVALID
  /api/reading-sessions:
    post:
      tags:
      - 전체 독서
      summary: 전체 독서 시작 또는 기존 기록 재개
      description: |
        구글 로그인 후 GET /api/csrf의 실제 token을 X-CSRF-TOKEN에 입력하세요.
        발췌 응답의 book.bookId를 문자열로 전달합니다. 예: {"bookId":"1"}
        새 기록은 1페이지·위치 0·version "0"으로 시작합니다. 기존 미완료 기록이 있으면 위치·상태·버전을 유지해 반환합니다.
        완료한 책을 다시 선택하면 새 기록을 만듭니다. 발췌 쪽수는 전체 진행량에 합산하지 않습니다.
        시작 후 페이지 조회는 별도 호출하고, 실제 재개 상태는 progress에 reading으로 저장하세요.
      operationId: start
      parameters:
      - name: X-CSRF-TOKEN
        in: header
        description: GET /api/csrf 실제 응답 token
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Start"
        required: true
      responses:
        "201":
          description: 새 전체 독서 기록
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReadingResponse"
        "200":
          description: 기존 미완료 기록 재사용
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReadingResponse"
        "400":
          description: 입력 형식·페이지·위치 오류
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: 로그인 필요·삭제된 회원
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: 상태 변경 요청의 CSRF 토큰 누락·위조
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: 없는/타 회원 독서 기록·미승인 도서·없는 페이지
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: 버전/완료 상태 충돌은 current 포함. 본문 변경은 code/message만 반환
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: "#/components/schemas/ReadingConflictResponse"
                - $ref: "#/components/schemas/ApiError"
        "503":
          description: 본문·저장 위치 데이터 무결성 확인 필요
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/reading-sessions/{sessionId}/complete:
    post:
      tags:
      - 전체 독서
      summary: 책 전체 독서 완료
      description: |
        먼저 마지막 페이지 끝을 progress로 저장하세요. 저장 응답의 최신 version을 문자열로 전달합니다. 예: {"version":"1"}
        현재 위치가 마지막 끝이어야 하며 과거에 끝에 갔다가 앞부분으로 돌아온 상태는 완료할 수 없습니다.
        완료 성공 시 version이 증가합니다. 같은 최신 version으로 다시 완료하면 기존 결과를 반환합니다.
        과거 version 재전송은 409와 최신 current입니다. 100% 도달과 completed 상태는 구분합니다.
      operationId: complete
      parameters:
      - name: X-CSRF-TOKEN
        in: header
        description: GET /api/csrf 실제 응답 token
        required: true
        schema:
          type: string
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Complete"
        required: true
      responses:
        "400":
          description: 입력 형식·페이지·위치 오류
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: 로그인 필요·삭제된 회원
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: 상태 변경 요청의 CSRF 토큰 누락·위조
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: 없는/타 회원 독서 기록·미승인 도서·없는 페이지
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: 버전/완료 상태 충돌은 current 포함. 본문 변경은 code/message만 반환
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: "#/components/schemas/ReadingConflictResponse"
                - $ref: "#/components/schemas/ApiError"
        "503":
          description: 본문·저장 위치 데이터 무결성 확인 필요
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: 전체 완료 기록
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReadingResponse"
  /api/previews:
    post:
      tags:
      - 추천 발췌
      summary: 첫 추천 발췌 생성
      description: |
        1. 구글 로그인 후 GET /api/csrf의 실제 응답 token을 X-CSRF-TOKEN에 입력하세요.
        2. requestedPageCount(정수 1~10)와 storyType(WARM/HUMOR/THOUGHTFUL/ANY)을 입력하세요.
        3. prompt는 선택이며 UTF-16 2,000단위 이하입니다. null·빈 문자열·공백만 입력하면 프롬프트 없이 처리합니다.
        카드만은 사전 벡터, 프롬프트가 있으면 FastAPI query 벡터를 사용합니다. 함께 입력하면 기본 카드 40%·프롬프트 60%입니다.
        ANY만 선택하면 GPU 없이 작품별 균등 선택 후 첫 페이지부터 제공합니다.
        10쪽 요청에 총 8쪽 작품이면 8쪽을 반환합니다. book에 작품 전체 쪽수·출처·번역 안내가 있습니다.
        발췌는 세션에 최대 10개 보관하며 초과 시 가장 오래된 발췌가 제거됩니다. 전체 독서 진행률에는 합산하지 않습니다.
        실행 전 도서 등록·권한 승인이 필요하며 벡터 검색에는 본문/카드 벡터 등록, 프롬프트에는 GPU 서버 연결도 필요합니다.
      operationId: create
      parameters:
      - name: X-CSRF-TOKEN
        in: header
        description: GET /api/csrf의 실제 응답 token. 로그인 후 새 토큰 사용
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewRequest"
            examples:
              카드와 프롬프트:
                description: 카드와 프롬프트
                value:
                  requestedPageCount: 5
                  storyType: WARM
                  prompt: 다시 시작할 용기를 얻고 싶어요
              카드만:
                description: 카드만
                value:
                  requestedPageCount: 10
                  storyType: HUMOR
              프롬프트만:
                description: 프롬프트만
                value:
                  requestedPageCount: 3
                  storyType: ANY
                  prompt: 외로움에 관한 이야기
              무작위 작품:
                description: 무작위 작품
                value:
                  requestedPageCount: 10
                  storyType: ANY
        required: true
      responses:
        "201":
          description: 첫 발췌 생성. Location 헤더로 재조회
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PreviewResponse"
        "400":
          description: 잘못된 쪽수·카드·프롬프트 또는 모델 입력 상한 초과
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: 로그인 필요·세션 만료
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: CSRF_INVALID. 현재 세션의 토큰 재조회 필요
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: NO_RECOMMENDATION_CANDIDATES 또는 BOOK_NOT_FOUND
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: 추천 처리 중 본문 버전 변경
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: 임베딩 서버 응답 형식 오류
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: 모델·벡터·본문 준비 부족 또는 GPU 연결/호환성 오류
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/previews/{previewId}/contrast:
    post:
      tags:
      - 대비 발췌
      summary: 대비 작품 발췌 추천
      description: |
        1. 구글 로그인·CSRF 조회 후 첫 추천을 생성하세요.
        2. 같은 세션의 첫 previewId와 현재 X-CSRF-TOKEN을 입력하세요. 요청 본문은 없습니다.
        원래 요청 쪽수를 유지하며 양쪽 실제 근거를 담을 수 있는 승인 관계만 사용합니다.
        후보가 없으면 200·available=false·NO_ELIGIBLE_CONTRAST이며 첫 작품의 전체 독서는 계속 가능합니다.
        성공 시 contrast에 두 번째 작품·연속 페이지·검수한 공통 주제/축/이유·양쪽 근거가 있습니다.
        첫 발췌와 같은 모델의 사전 벡터를 재사용하고 ANY 단독의 첫 발췌는 활성 모델을 사용합니다.
        새 GPU 요청·두 번째 previewId 생성은 없습니다. 재요청하면 현재 승인 자료로 다시 계산합니다.
        원하는 작품의 bookId를 전체 독서 시작 API에 전달하세요. CSV 후보만 등록한 상태에서는 대비가 제공되지 않습니다.
      operationId: contrast
      parameters:
      - name: X-CSRF-TOKEN
        in: header
        description: GET /api/csrf의 실제 응답 token
        required: true
        schema:
          type: string
      - name: previewId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: 대비 발췌 또는 후보 없음
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ContrastResponse"
        "400":
          description: 잘못된 previewId 형식
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: 로그인 필요·삭제 회원
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: 현재 세션의 CSRF 토큰 확인 필요
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: PREVIEW_NOT_FOUND 또는 BOOK_NOT_FOUND
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: 첫 발췌 본문 변경. 새 추천 필요
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: 필요한 벡터·본문·승인 근거의 준비/무결성 오류
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/reading-sessions/{sessionId}/progress:
    patch:
      tags:
      - 전체 독서
      summary: 현재 위치·중단 상태 저장
      description: |
        로그인·CSRF 토큰이 필요합니다. 예: {"pageNo":1,"position":10,"version":"0","status":"reading"}
        pageNo는 정수 1 이상, position은 해당 페이지의 UTF-16 위치 0~content.length입니다. 이모지 중간 위치는 거절합니다.
        status는 reading 또는 paused입니다. 현재 위치를 뒤로 옮겨도 최대 위치와 진행률은 감소하지 않습니다.
        성공 시 version이 증가합니다. 409의 current를 반영하고 과거 요청의 version만 바꿔 자동 재전송하지 마세요.
        완료한 기록은 수정할 수 없습니다. 페이지 이동·중단·완료 직전에 위치를 저장하세요.
      operationId: progress
      parameters:
      - name: X-CSRF-TOKEN
        in: header
        description: GET /api/csrf 실제 응답 token
        required: true
        schema:
          type: string
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Progress"
        required: true
      responses:
        "400":
          description: 입력 형식·페이지·위치 오류
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: 로그인 필요·삭제된 회원
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: 상태 변경 요청의 CSRF 토큰 누락·위조
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: 없는/타 회원 독서 기록·미승인 도서·없는 페이지
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: 버전/완료 상태 충돌은 current 포함. 본문 변경은 code/message만 반환
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: "#/components/schemas/ReadingConflictResponse"
                - $ref: "#/components/schemas/ApiError"
        "503":
          description: 본문·저장 위치 데이터 무결성 확인 필요
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: 증가한 버전과 저장된 현재/최대 위치
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReadingResponse"
  /api/reading-sessions/{sessionId}:
    get:
      tags:
