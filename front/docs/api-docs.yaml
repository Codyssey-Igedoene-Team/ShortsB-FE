        로그인 후 호출합니다. GET에는 CSRF 헤더가 필요 없습니다.
        bookId를 생략하면 최근 저장한 미완료 기록 하나를, 지정하면 그 책의 미완료 기록을 반환합니다.
        없으면 204이며 응답 본문이 없습니다. reading/paused 상태만 대상으로 하며 조회 자체는 위치·상태를 바꾸지 않습니다.
