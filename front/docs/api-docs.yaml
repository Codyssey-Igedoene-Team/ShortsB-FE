        진행률은 원본 페이지 본문 길이 기준이고, 발췌 분량은 포함하지 않습니다.
        본인 소유가 아니거나 없는 기록은 404입니다. 본문 버전이 바뀌면 409이며 기존 위치를 자동 보정하지 않습니다.
