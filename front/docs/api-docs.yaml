  /api/previews/{previewId}:
    get:
      tags:
      - 추천 발췌
      summary: 저장된 발췌 재조회
      description: |
        첫 추천 응답의 previewId를 같은 로그인 세션에서 입력하세요. GPU 재호출 없이 저장했던 범위의 현재 본문을 조회합니다.
        GET이므로 CSRF 헤더는 필요 없습니다. 다른 사용자의 발췌·보관 상한으로 제거된 발췌는 404입니다.
        로그아웃·세션 만료·서버 재시작으로 발췌가 사라지면 새 추천을 요청하세요.
        본문 버전이 변경되면 409, 작품이 미승인 상태가 되면 404이며 기존 본문을 그대로 노출하지 않습니다.
      operationId: get_1
      parameters:
      - name: previewId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: 동일 발췌 범위의 작품 정보·페이지
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PreviewResponse"
        "400":
          description: 잘못된 UUID
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: 로그인 필요
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: PREVIEW_NOT_FOUND 또는 BOOK_NOT_FOUND
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: PREVIEW_CONTENT_CHANGED. 새 추천 필요
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: CONTENT_UNAVAILABLE. 본문 무결성 확인 필요
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/me:
    get:
      tags:
      - 회원
      summary: 로그인한 내 정보 조회
      description: |
        먼저 문서 상단의 구글 로그인 링크를 새 탭에서 열어 로그인하세요.
        같은 브라우저의 세션 쿠키로 본인 정보를 조회하며 사용자 ID나 토큰을 직접 입력하지 않습니다.
        회원 ID는 문자열입니다. 로그아웃 후 다시 Execute하면 401이 반환돼야 합니다.
      operationId: me
      responses:
        "200":
          description: 로그인한 회원 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
              example:
                id: "1"
                email: reader@example.com
                nickname: 독자
        "401":
          description: 비로그인·세션 만료 또는 삭제된 회원
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: AUTHENTICATION_REQUIRED
                message: 로그인이 필요합니다.
        "500":
          description: 회원 조회 중 서버 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/csrf:
    get:
      tags:
      - 인증
      summary: CSRF 토큰 조회
      description: |
        로그인 전에도 호출할 수 있습니다. Try it out → Execute 후 실제 응답의 token을 복사하세요.
        로그아웃 요청의 X-CSRF-TOKEN 입력란에 붙여넣습니다.
        로그인·로그아웃 이후에는 기존 토큰을 재사용하지 말고 이 API를 다시 호출하세요.
        세션 쿠키는 브라우저가 전달하며 별도 요청값은 없습니다.
      operationId: csrf
      responses:
        "200":
          description: 현재 세션의 토큰과 헤더 이름. 응답은 캐시하지 않습니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfResponse"
  /api/books/{bookId}:
    get:
      tags:
      - 도서
      summary: 도서 정보 조회
      description: |
        구글 로그인 후 발췌 응답의 book.bookId를 입력하세요. ID는 제공 자료의 문자열 ID가 아닌 서비스 내부 ID입니다.
        제목·저자·전체 쪽수·판본·출처·번역 안내를 조회하며 전체 본문을 반환하지 않습니다.
        미존재·미승인·원본 페이지가 준비되지 않은 작품은 모두 404입니다. GET 요청에는 CSRF 헤더가 필요 없습니다.
      operationId: get_2
      parameters:
      - name: bookId
        in: path
        description: 발췌 응답의 book.bookId
        required: true
        schema:
          type: integer
          format: int64
          exclusiveMinimum: 0
        example: 1
      responses:
        "200":
          description: 승인 도서 정보
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BookResponse"
        "400":
          description: 양의 정수가 아닌 내부 도서 ID
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: 로그인 필요·삭제된 회원
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: BOOK_NOT_FOUND
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    Start:
      type: object
      description: 책 전체 독서 시작. 발췌 범위는 입력하지 않음
      properties:
        bookId:
          type: string
          description: 발췌 응답의 book.bookId. 문자열
          example: "1"
          minLength: 1
          pattern: "[1-9][0-9]{0,18}"
      required:
      - bookId
    ApiError:
      type: object
      description: API 공통 오류 응답
      properties:
        code:
          type: string
          description: 오류를 구분하는 코드
          example: AUTHENTICATION_REQUIRED
        message:
          type: string
          description: 사용자에게 안내할 메시지
          example: 로그인이 필요합니다.
    BookResponse:
      type: object
      description: 제공 승인을 받은 작품의 정보와 원본 출처 안내
      properties:
        bookId:
          type: string
          description: 서비스 내부 도서 ID. 문자열
          example: "1"
        title:
          type: string
          description: 작품 제목
        author:
          type: string
          description: 저자 표시명
        totalPageCount:
          type: integer
          format: int32
          description: 서비스 전체 쪽수. 원본 pages 개수
          example: 8
        edition:
          type: string
          description: 확보한 판본 식별값
        editionLabel:
          type: string
          description: 판본 표시 안내
        language:
          type: string
          description: 본문 언어 코드
          example: ko
        workType:
          type: string
          description: 원본 자료의 작품 유형
        sourceName:
          type: string
          description: 본문 출처 이름
        sourceUrl:
          type: string
          description: 본문 출처 URL
        licenseUrl:
          type: string
          description: 이용 조건 URL. 없으면 null
        licenseLabel:
          type: string
          description: 이용 조건 표시. 없으면 null
        credits:
          type: string
          description: 출처·기여자 표시. 없으면 null
        translationNote:
          type: string
          description: AI 번역·교열 전 등 원본 자료의 안내. 원문 그대로 제공
    ReadingConflictResponse:
      type: object
      description: 409 충돌 응답. 과거 요청의 version만 바꿔 자동 재전송하지 않음
      properties:
        code:
          type: string
          description: READING_VERSION_CONFLICT / READING_ALREADY_COMPLETED / READING_NOT_AT_END
        message:
          type: string
          description: 충돌 안내
        current:
          $ref: "#/components/schemas/ReadingResponse"
          description: 클라이언트가 반영할 최신 상태
    ReadingResponse:
      type: object
      description: "책 전체 독서 기록. 현재 위치는 재개용, 최대 위치는 진행률 계산용"
      properties:
        sessionId:
          type: string
          description: 전체 독서 세션 ID. 문자열
          example: "1"
        book:
          $ref: "#/components/schemas/BookResponse"
          description: 승인 도서와 전체 쪽수·출처
        currentPageNo:
          type: integer
          format: int32
          description: 재개할 현재 페이지. 1-based
          example: 1
        currentPosition:
          type: integer
          format: int32
          description: 현재 페이지 내 UTF-16 위치
          example: 0
        furthestPageNo:
          type: integer
          format: int32
          description: 최대 도달 페이지
        furthestPosition:
          type: integer
          format: int32
          description: 최대 도달 페이지 내 UTF-16 위치
        progressPercent:
          type: number
          description: 최대 본문 위치 기준 0~100. 소수 둘째 자리까지 내림
          example: 12.34
        status:
          type: string
          description: reading / paused / completed
        version:
          type: string
          description: 저장 버전. 변경 요청에 그대로 전달할 문자열
          example: "0"
        startedAt:
          type: string
          format: date-time
          description: 전체 독서 시작 시각
        updatedAt:
          type: string
          format: date-time
          description: 마지막 저장 시각
        completedAt:
          type: string
          format: date-time
          description: 전체 완료 시각. 미완료면 null
    Complete:
      type: object
      description: 마지막 페이지 끝을 저장한 후 최신 version으로 전체 완료
      properties:
        version:
          type: string
          description: 최신 저장 응답의 version. 문자열
          example: "1"
          minLength: 1
          pattern: "[0-9]{1,19}"
      required:
      - version
    PreviewRequest:
      type: object
      description: 첫 추천 요청. 쪽수·카드는 필수이며 프롬프트는 선택
      properties:
        requestedPageCount:
          type: string
          format: int32
          description: 보고 싶은 쪽수. 1~10 정수
          example: 5
          maximum: 10
          minimum: 1
        storyType:
          type: string
          description: 이야기 카드 하나. ANY도 명시적으로 선택
          enum:
          - WARM
          - HUMOR
          - THOUGHTFUL
          - ANY
          example: WARM
        prompt:
          type: string
          description: "선택 자유 프롬프트. UTF-16 2,000단위 이하. 공백만 있으면 입력 없음"
          example: 다시 시작할 용기를 얻고 싶어요
          maxLength: 2000
          minLength: 0
      required:
      - requestedPageCount
      - storyType
    PageResponse:
      type: object
      description: 분할을 변경하지 않은 원본 표시 페이지
      properties:
        pageNo:
          type: integer
          format: int32
          description: 1부터 시작하는 페이지 번호
          example: 1
        content:
          type: string
          description: 해당 페이지 본문. 생성된 요약이 아닌 저장 원문
    PreviewResponse:
      type: object
      description: 첫 발췌 결과. 요청 쪽수와 실제 제공 쪽수를 구분하며 독서 진행률에는 합산하지 않음
      properties:
        previewId:
          type: string
          description: 세션에 보관된 발췌 UUID. 조회와 후속 대비 참조에 사용
        book:
          $ref: "#/components/schemas/BookResponse"
          description: 도서·출처·번역 안내
        requestedPageCount:
          type: integer
          format: int32
          description: 원래 요청 쪽수. 후속 대비에도 같은 값 적용
          example: 10
        actualPageCount:
          type: integer
          format: int32
          description: "실제 제공 쪽수. min(요청,작품 전체)"
          example: 8
        startPageNo:
          type: integer
          format: int32
          description: 발췌 시작 페이지. 1부터 시작
          example: 1
        endPageNo:
          type: integer
          format: int32
          description: 발췌 끝 페이지. 포함
          example: 8
        storyType:
          type: string
          description: 요청 시 선택한 카드
          enum:
          - WARM
          - HUMOR
          - THOUGHTFUL
          - ANY
        recommendationType:
          type: string
          description: "RANDOM, CARD, PROMPT, CARD_AND_PROMPT 중 추천 경로"
        matchedPageNo:
          type: integer
          format: int32
          description: 벡터 검색으로 선택한 기준 페이지. RANDOM이면 null
        reason:
          type: string
          description: 실제 추천 방식 안내. 생성형 본문 해석이 아닌 고정 설명
        pages:
          type: array
          description: 시작~끝의 순서대로 제공하는 원본 페이지
          items:
            $ref: "#/components/schemas/PageResponse"
    ContrastResponse:
      type: object
      description: 첫 발췌와 연결된 대비 결과. 후보 없음도 정상 200 응답
      properties:
        available:
          type: boolean
          description: 대비 제공 가능 여부
        sourcePreviewId:
          type: string
          description: 첫 발췌 UUID
        reasonCode:
          type: string
          description: "없으면 NO_ELIGIBLE_CONTRAST, 성공이면 null"
        contrast:
          $ref: "#/components/schemas/Result"
          description: 대비 결과. 후보가 없으면 null
    EvidenceReference:
      type: object
      properties:
        bookId:
          type: string
          description: 내부 작품 ID. 문자열
        startPageNo:
          type: integer
          format: int32
          description: 근거 첫 페이지
        endPageNo:
          type: integer
          format: int32
          description: 근거 마지막 페이지. 포함
        quote:
          type: string
          description: 지정 범위에 실제 포함된 검수 구절
    Result:
      type: object
      properties:
        relationId:
          type: string
          description: 승인된 대비 관계 ID. 문자열
        contrastAxis:
          type: string
          description: texture/perspective/tone/attitude/ending/setting
        contrastAxisLabel:
          type: string
          description: 대비 축의 한국어 표시
        commonTopic:
          type: string
          description: 사람이 검수한 공통 주제
        reason:
          type: string
          description: 양쪽 실제 근거로 검수한 대비 설명
        requestedPageCount:
          type: integer
          format: int32
          description: 원래 요청 쪽수
        actualPageCount:
          type: integer
          format: int32
          description: 대비 작품 실제 제공 쪽수
        book:
          $ref: "#/components/schemas/BookResponse"
          description: 대비 작품. bookId로 전체 독서 시작 가능
        startPageNo:
          type: integer
          format: int32
          description: 대비 발췌 시작 페이지
        endPageNo:
          type: integer
          format: int32
          description: 대비 발췌 끝 페이지. 포함
        sourceEvidence:
          $ref: "#/components/schemas/EvidenceReference"
          description: 첫 발췌 내부의 승인 근거
        targetEvidence:
          $ref: "#/components/schemas/EvidenceReference"
          description: 두 번째 발췌 내부의 승인 근거
        pages:
          type: array
          description: 대비 작품의 원본 연속 페이지
          items:
            $ref: "#/components/schemas/PageResponse"
    Progress:
      type: object
      description: 현재 위치와 상태 저장. 조회한 version을 그대로 전달
      properties:
        pageNo:
          type: string
          description: 1-based 현재 페이지
          example: 1
          minimum: 1
        position:
          type: string
          description: 페이지 내 UTF-16 위치. 끝 위치도 허용
          example: 10
          minimum: 0
        version:
          type: string
          description: 조회 응답의 version. 문자열
          example: "0"
          minLength: 1
          pattern: "[0-9]{1,19}"
        status:
          type: string
          description: 읽는 중 또는 중단
          enum:
          - reading
          - paused
          example: reading
          pattern: reading|paused
      required:
      - pageNo
      - position
      - status
      - version
    MeResponse:
      type: object
      description: 현재 세션으로 인증된 회원 정보
      properties:
        id:
          type: string
          description: 서비스 내부 회원 ID. JavaScript 정밀도 손실 방지를 위한 문자열
          example: "1"
        email:
          type: string
          description: 구글에서 확인한 이메일
          example: reader@example.com
        nickname:
          type: string
          description: 표시 이름. 등록된 이름이 없으면 null
          example: 독자
    CsrfResponse:
      type: object
      description: 상태 변경 요청에 사용할 세션 기반 CSRF 토큰
      properties:
        token:
          type: string
          description: Execute 후 실제 응답에서 복사할 토큰. 로그인·로그아웃 후 다시 조회한다.
        headerName:
          type: string
          description: 토큰을 전달할 HTTP 헤더 이름
          example: X-CSRF-TOKEN
      required:
      - headerName
      - token
